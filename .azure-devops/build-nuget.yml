# Builds and packs the SCIP .NET port, and publishes to NuGet from main. Runs on a Windows agent, as
# curiosity-ai/hnsw-sharp and curiosity-ai/tesserae do. Tests are not run here (run `dotnet test` locally / elsewhere);
# it builds Scip.Packages.slnx (the packable src projects only), not Scip.slnx (which also has tests and Reprolang).
#
# Produces (artifacts\package\release):
#   ScipSharp                 core library (assembly/namespace `Scip`; the NuGet id `Scip` is taken)
#   ScipSharp.Indexing        indexer abstractions
#   ScipSharp.Indexer.<Language>  one package per language indexer (DotNet, Java, TypeScript, Python, Ruby, Rust, Clang, Dart, Php)
#   ScipSharp.Cli             the `scip` .NET tool  (dotnet tool install -g ScipSharp.Cli)
#
# Conventions follow curiosity-ai/tesserae (.reference/tesserae/.azure-devops/build-nuget-h5.yml.disabled) and
# curiosity-ai/hnsw-sharp: yy.M.<buildId mod 65535> versions and the `nuget-curiosity-org` service connection.
#
# Why Windows: NuGetCommand@2 runs nuget.exe, which needs mono on Linux (not on Ubuntu 24.04 agents), and
# DotNetCoreCLI@2 push cannot use the encrypted API key stored in the service connection.

variables:
  buildConfiguration: 'Release'
  # NOTE: never name a pipeline variable after an MSBuild property (Version, PackageVersion, ...): every pipeline
  # variable is also exported as an environment variable, and MSBuild reads those as properties.
  # Hence `buildVersion` and not `version`.

trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - .reference/*
    - docs/*
    - '*.md'

pr:
  branches:
    include:
    - main

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- task: NuGetToolInstaller@1
  displayName: 'Install NuGet 7.6 or later (API key service connections need it)'
  inputs:
    versionSpec: '>=7.6.0'
    checkLatest: true

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      # yy.M.<build id mod 65535>, as in curiosity-ai/hnsw-sharp. Every part of an assembly version must fit in
      # 16 bits (65535 itself is rejected too: error CS7034), and the Azure build id grows past that, so wrap it.
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildId = [int]$env:BUILD_BUILDID
      $modBuildId = $buildId % 65535
      $newBuildVersion = "$dottedDate.$modBuildId"
      Write-Host "##vso[task.setvariable variable=buildVersion]$newBuildVersion"
      Write-Host "Updated buildVersion to '$newBuildVersion'"

- task: UseDotNet@2
  displayName: 'Use .NET 11 SDK'
  inputs:
    packageType: sdk
    version: 11.x
    includePreviewVersions: true
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: CmdLine@2
  displayName: 'Restore'
  inputs:
    script: 'dotnet restore Scip.Packages.slnx'

- task: CmdLine@2
  displayName: 'Build'
  inputs:
    script: 'dotnet build Scip.Packages.slnx -c $(buildConfiguration) --no-restore /p:Version=$(buildVersion)'

- task: CmdLine@2
  displayName: 'Pack (libraries, indexers and the scip tool)'
  inputs:
    script: 'dotnet pack Scip.Packages.slnx -c $(buildConfiguration) --no-build /p:Version=$(buildVersion)'

- task: PublishPipelineArtifact@1
  displayName: 'Publish packages as pipeline artifact'
  inputs:
    targetPath: '$(Build.SourcesDirectory)\artifacts\package\release'
    artifact: 'nuget-packages'

# Only publish from main, never from PR validation builds.
# Pushing a .nupkg to nuget.org also uploads the adjacent .snupkg symbol package.
- task: NuGetCommand@2
  displayName: 'Push packages to NuGet'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    command: 'push'
    packagesToPush: '$(Build.SourcesDirectory)\artifacts\package\release\*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
